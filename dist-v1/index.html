<script type="module">
async function gun(id){
  const b64 = document.getElementById(id).textContent.trim();
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
try {
  const css = await gun('bundle');
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
  const js = await gun('appcode');
  const url = URL.createObjectURL(new Blob([js], {type:'text/javascript'}));
  await import(url);
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="color:#fbbf24;font:13px/1.5 monospace;padding:24px;white-space:pre-wrap">OSINT RC failed to boot:\n' + (e && e.message || e) + '</pre>');
}
</script>
